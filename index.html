<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sophias Sterne</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #fdf1f4 0%, #fbe6ec 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px 16px 40px;
  }
  .app {
    width: 100%;
    max-width: 900px;
  }
  header {
    text-align: center;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 28px;
    color: #7a4a1f;
  }
  header .date {
    font-size: 15px;
    color: #a9865c;
    margin-top: 4px;
  }
  .star-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    font-size: 28px;
    margin: 10px 0 16px;
  }
  .star-row span.dim { opacity: 0.25; }
  .columns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 14px;
  }
  .section {
    background: #ffffff;
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    position: relative;
  }
  .section h2 .done-badge {
    font-size: 15px;
    margin-left: 4px;
    opacity: 0;
    display: inline-block;
  }
  .section h2 .done-badge.show {
    opacity: 1;
  }
  .section.section-glow { animation: sectionGlow 2s ease; }
  @keyframes sectionGlow {
    0% { box-shadow: 0 2px 8px rgba(0,0,0,0.06); transform: scale(1); }
    25% { box-shadow: 0 0 0 5px rgba(240,159,39,0.3), 0 4px 14px rgba(0,0,0,0.08); transform: scale(1.02); }
    55% { box-shadow: 0 0 0 3px rgba(240,159,39,0.18), 0 4px 14px rgba(0,0,0,0.08); transform: scale(1.01); }
    100% { box-shadow: 0 2px 8px rgba(0,0,0,0.06); transform: scale(1); }
  }
  .badge-pop { animation: badgePop 0.45s ease; }
  @keyframes badgePop {
    0% { transform: scale(0); }
    60% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .sparkle {
    position: absolute;
    font-size: 18px;
    pointer-events: none;
    animation: sparklePulse 1.3s ease forwards;
  }
  @keyframes sparklePulse {
    0% { opacity: 0; transform: scale(0.5) translateY(4px); }
    30% { opacity: 1; transform: scale(1.15) translateY(0); }
    70% { opacity: 1; transform: scale(1) translateY(-4px); }
    100% { opacity: 0; transform: scale(0.85) translateY(-12px); }
  }
  .section h2 {
    font-size: 18px;
    color: #7a4a1f;
    margin-bottom: 10px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 10px;
    border-radius: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
    border: 2px solid transparent;
  }
  .task:last-child { margin-bottom: 0; }
  .task:active { transform: scale(0.97); }
  .task.pop-animate { animation: taskPop 0.4s ease; }
  @keyframes taskPop {
    0% { transform: scale(1); }
    35% { transform: scale(1.07); background: #fff3cf; }
    100% { transform: scale(1); }
  }
  .task.pop-animate .check { animation: checkPop 0.45s ease; display: inline-block; }
  @keyframes checkPop {
    0% { transform: scale(0) rotate(-20deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .task .emoji { font-size: 30px; }
  .task .label { font-size: 18px; flex: 1; color: #4a3a2a; }
  .task .check { font-size: 24px; }
  .task.open {
    background: #fff8ee;
    border-color: #f0dfc4;
  }
  .task.done {
    background: #e8f7e6;
    border-color: #b6e6ae;
  }
  .task.done .label { color: #4a7a3f; }
  .bottom-row {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 12px;
    align-items: stretch;
  }
  .piggy {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff0d6;
    border-radius: 18px;
    padding: 16px 18px;
  }
  .piggy .left { display: flex; align-items: center; gap: 10px; }
  .piggy .emoji { font-size: 32px; }
  .piggy .text { font-size: 15px; color: #7a4a1f; }
  .piggy .amount { font-size: 22px; font-weight: bold; color: #b5732a; }
  .celebrate {
    display: none;
    text-align: center;
    font-size: 20px;
    color: #4a7a3f;
    background: #e8f7e6;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .celebrate.show { display: block; }
  .week {
    background: #ffffff;
    border-radius: 18px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .week h2 {
    font-size: 18px;
    color: #7a4a1f;
    margin-bottom: 10px;
  }
  .week-row {
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .day-col {
    flex: 1;
    text-align: center;
  }
  .day-col .d { font-size: 12px; color: #a9865c; margin-bottom: 4px; }
  .day-col .box {
    border-radius: 10px;
    padding: 8px 2px;
    font-size: 18px;
    background: #f5f0e6;
  }
  .day-col .box.full { background: #ffe9a8; }
  .day-col .box.today { border: 2px solid #e0a53f; }
  .week-total {
    text-align: center;
    margin-top: 10px;
    font-size: 14px;
    color: #7a4a1f;
  }

  .confetti-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .confetti-overlay.show { opacity: 1; }
  .confetti-piece {
    position: absolute;
    top: -40px;
    animation-name: confettiFall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(115vh) rotate(360deg); }
  }
  .confetti-message {
    position: absolute;
    top: 38%;
    left: 50%;
    background: #fff8ee;
    border-radius: 20px;
    padding: 22px 30px;
    font-size: 24px;
    line-height: 1.4;
    text-align: center;
    color: #7a4a1f;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    animation: messagePop 0.5s ease forwards;
  }
  @keyframes messagePop {
    0% { transform: translate(-50%, -50%) scale(0); }
    60% { transform: translate(-50%, -50%) scale(1.15); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  .loader-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #fdf1f4 0%, #fbe6ec 100%);
    overflow: hidden;
    transition: opacity 0.6s ease;
  }
  .loader-overlay.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .loader-star {
    font-size: 64px;
    animation: loaderStarPulse 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 14px rgba(240, 159, 39, 0.5));
  }
  @keyframes loaderStarPulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.18) rotate(8deg); }
  }
  .loader-title {
    margin-top: 14px;
    font-size: 22px;
    color: #7a4a1f;
    opacity: 0;
    animation: loaderFadeIn 0.8s ease forwards 0.2s;
  }
  @keyframes loaderFadeIn {
    to { opacity: 1; }
  }
  .loader-stars {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    font-size: 22px;
  }
  .loader-stars span {
    opacity: 0.25;
    transform: scale(0.8);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .loader-stars span.lit {
    opacity: 1;
    transform: scale(1.15);
  }
  .loader-sparkle {
    position: absolute;
    bottom: -10px;
    font-size: 16px;
    opacity: 0;
    animation: loaderSparkleRise linear forwards;
  }
  @keyframes loaderSparkleRise {
    0% { opacity: 0; transform: translateY(0) scale(0.6); }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-90vh) scale(1.1); }
  }
</style>
</head>
<body>
<div class="loader-overlay" id="loaderOverlay">
  <div class="loader-star">⭐</div>
  <div class="loader-title">Sophias Sterne</div>
  <div class="loader-stars" id="loaderStars">
    <span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span>
  </div>
</div>

<div class="app">
  <header>
    <h1>⭐ Sophias Sterne ⭐</h1>
    <div class="date" id="dateLabel"></div>
  </header>

  <div class="star-row" id="starRow"></div>

  <div class="celebrate" id="celebrate">🎉 Alle Sterne! 1 Euro fürs Sparschwein! 🐷</div>

  <div class="columns">
    <div class="section" id="section-morning">
      <h2>🌅 Früh <span class="done-badge" id="badge-morning">✅</span></h2>
      <div id="morning"></div>
    </div>

    <div class="section" id="section-afternoon">
      <h2>☀️ Nachmittag <span class="done-badge" id="badge-afternoon">✅</span></h2>
      <div id="afternoon"></div>
    </div>

    <div class="section" id="section-evening">
      <h2>🌙 Abend <span class="done-badge" id="badge-evening">✅</span></h2>
      <div id="evening"></div>
    </div>
  </div>

  <div class="bottom-row">
    <div class="piggy">
      <div class="left">
        <div class="emoji">🐷</div>
        <div class="text">Sparschwein gesamt</div>
      </div>
      <div class="amount" id="piggyTotal">0 €</div>
    </div>

    <div class="week">
      <h2>📅 Diese Woche</h2>
      <div class="week-row" id="weekRow"></div>
      <div class="week-total" id="weekTotal"></div>
    </div>
  </div>
</div>

<div class="confetti-overlay" id="confettiOverlay"></div>


<script>
  const TASKS = {
    morning: [
      { id: "m0", emoji: "🛏️", label: "Bett machen" },
      { id: "m1", emoji: "👕", label: "Anziehen" },
      { id: "m4", emoji: "💇‍♀️", label: "Haare kämmen" },
      { id: "m2", emoji: "🦷", label: "Zähne putzen" },
      { id: "m3", emoji: "🍽️", label: "Teller wegräumen" }
    ],
    afternoon: [
      { id: "a1", emoji: "🧸", label: "Spielsachen aufräumen" },
      { id: "a2", emoji: "😇", label: "Brav sein" }
    ],
    evening: [
      { id: "e5", emoji: "🍽️", label: "Teller wegräumen" },
      { id: "e2", emoji: "🛁", label: "Duschen oder baden" },
      { id: "e1", emoji: "📺", label: "Filmschauen abdrehen" },
      { id: "e4", emoji: "🦷", label: "Zähne putzen" },
      { id: "e3", emoji: "🌜", label: "Pyjama anziehen" }
    ]
  };

  const ALL_TASK_IDS = [...TASKS.morning, ...TASKS.afternoon, ...TASKS.evening].map(t => t.id);
  const TOTAL_STARS = ALL_TASK_IDS.length;
  const STORAGE_KEY = "sophia_sterne_data_v1";

  function todayKey(d = new Date()) {
    return d.toISOString().slice(0, 10);
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { days: {}, piggyTotal: 0 };
  }

  function saveData(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  let data = loadData();
  const key = todayKey();
  let lastToggledId = null;

  if (!data.days[key]) {
    data.days[key] = { done: {}, rewarded: false, sectionDone: { morning: false, afternoon: false, evening: false } };
  }
  saveData(data);

  const today = data.days[key];
  if (!today.sectionDone) {
    today.sectionDone = { morning: false, afternoon: false, evening: false };
  }

  function countDoneToday() {
    return ALL_TASK_IDS.filter(id => today.done[id]).length;
  }

  function renderTasks(sectionId, tasks) {
    const el = document.getElementById(sectionId);
    el.innerHTML = "";
    tasks.forEach(t => {
      const done = !!today.done[t.id];
      const row = document.createElement("div");
      let cls = "task " + (done ? "done" : "open");
      if (t.id === lastToggledId) cls += " pop-animate";
      row.className = cls;
      row.innerHTML =
        '<div class="emoji">' + t.emoji + '</div>' +
        '<div class="label">' + t.label + '</div>' +
        '<div class="check">' + (done ? "✅" : "⬜") + '</div>';
      row.addEventListener("click", () => {
        const wasDone = !!today.done[t.id];
        today.done[t.id] = !wasDone;
        const hadReward = today.rewarded;
        checkAllDone();
        const justCompletedSection = checkSectionsDone();
        saveData(data);
        lastToggledId = t.id;
        renderAll();
        lastToggledId = null;
        if (!hadReward && today.rewarded) {
          triggerBigCelebration();
        } else if (justCompletedSection) {
          triggerSectionCelebration(justCompletedSection);
        }
      });
      el.appendChild(row);
    });
  }

  function checkSectionsDone() {
    let justCompleted = null;
    Object.keys(TASKS).forEach(secKey => {
      const ids = TASKS[secKey].map(t => t.id);
      const allDone = ids.every(id => today.done[id]);
      if (allDone && !today.sectionDone[secKey]) {
        today.sectionDone[secKey] = true;
        justCompleted = secKey;
      } else if (!allDone && today.sectionDone[secKey]) {
        today.sectionDone[secKey] = false;
      }
    });
    return justCompleted;
  }

  function checkAllDone() {
    const count = countDoneToday();
    const celebrateEl = document.getElementById("celebrate");
    if (count === TOTAL_STARS && !today.rewarded) {
      today.rewarded = true;
      data.piggyTotal = (data.piggyTotal || 0) + 1;
      celebrateEl.classList.add("show");
    } else if (count < TOTAL_STARS && today.rewarded) {
      today.rewarded = false;
      data.piggyTotal = Math.max(0, (data.piggyTotal || 0) - 1);
      celebrateEl.classList.remove("show");
    } else if (count === TOTAL_STARS && today.rewarded) {
      celebrateEl.classList.add("show");
    } else {
      celebrateEl.classList.remove("show");
    }
  }

  function renderStars() {
    const count = countDoneToday();
    const row = document.getElementById("starRow");
    row.innerHTML = "";
    for (let i = 0; i < TOTAL_STARS; i++) {
      const s = document.createElement("span");
      s.textContent = "⭐";
      if (i >= count) s.className = "dim";
      row.appendChild(s);
    }
  }

  function renderDate() {
    const d = new Date();
    const opts = { weekday: "long", day: "numeric", month: "long" };
    document.getElementById("dateLabel").textContent =
      d.toLocaleDateString("de-AT", opts);
  }

  function renderPiggy() {
    document.getElementById("piggyTotal").textContent =
      (data.piggyTotal || 0) + " €";
  }

  function renderWeek() {
    const weekRow = document.getElementById("weekRow");
    weekRow.innerHTML = "";
    const dayNames = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
    const now = new Date();
    const currentDow = (now.getDay() + 6) % 7; // Montag = 0
    const monday = new Date(now);
    monday.setDate(now.getDate() - currentDow);

    let weekStarSum = 0;

    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const dKey = todayKey(d);
      const dayData = data.days[dKey];
      const doneCount = dayData
        ? ALL_TASK_IDS.filter(id => dayData.done[id]).length
        : 0;
      const full = doneCount === TOTAL_STARS && doneCount > 0;
      if (dayData) weekStarSum += doneCount;

      const col = document.createElement("div");
      col.className = "day-col";
      const isToday = dKey === key;
      col.innerHTML =
        '<div class="d">' + dayNames[i] + '</div>' +
        '<div class="box ' + (full ? "full" : "") + (isToday ? " today" : "") + '">' +
        (full ? "🌟" : (doneCount > 0 ? doneCount : "·")) +
        '</div>';
      weekRow.appendChild(col);
    }

    document.getElementById("weekTotal").textContent =
      "⭐ " + weekStarSum + " Sterne diese Woche";
  }

  function triggerBigCelebration() {
    const overlay = document.getElementById("confettiOverlay");
    overlay.innerHTML =
      '<div class="confetti-message">🎉🌟 Alle Sterne! 🌟🎉<br>+1 € fürs Sparschwein! 🐷</div>';
    const emojis = ["⭐", "🎉", "✨", "🌟", "🎊"];
    for (let i = 0; i < 34; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      piece.style.left = Math.random() * 100 + "%";
      piece.style.fontSize = (18 + Math.random() * 18) + "px";
      piece.style.animationDuration = (2 + Math.random() * 1.5) + "s";
      piece.style.animationDelay = (Math.random() * 0.5) + "s";
      overlay.appendChild(piece);
    }
    overlay.classList.add("show");
    setTimeout(() => {
      overlay.classList.remove("show");
      overlay.innerHTML = "";
    }, 3200);
  }

  function triggerSectionCelebration(secKey) {
    const el = document.getElementById("section-" + secKey);
    if (!el) return;
    el.classList.add("section-glow");
    setTimeout(() => el.classList.remove("section-glow"), 2000);

    const sparkleEmojis = ["✨", "⭐", "🎈"];
    const totalDuration = 5000;
    const spawnInterval = 280;
    let elapsed = 0;
    const intervalId = setInterval(() => {
      if (elapsed >= totalDuration) {
        clearInterval(intervalId);
        return;
      }
      const s = document.createElement("span");
      s.className = "sparkle";
      s.textContent = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
      s.style.left = (5 + Math.random() * 85) + "%";
      s.style.top = (8 + Math.random() * 78) + "%";
      el.appendChild(s);
      setTimeout(() => s.remove(), 1300);
      elapsed += spawnInterval;
    }, spawnInterval);
  }

  function renderAll() {
    renderStars();
    renderTasks("morning", TASKS.morning);
    renderTasks("afternoon", TASKS.afternoon);
    renderTasks("evening", TASKS.evening);
    renderPiggy();
    renderWeek();
    Object.keys(TASKS).forEach(secKey => {
      const badge = document.getElementById("badge-" + secKey);
      if (badge) badge.classList.toggle("show", !!today.sectionDone[secKey]);
    });
  }

  renderDate();
  checkAllDone();
  checkSectionsDone();
  saveData(data);
  renderAll();

  (function runLoader() {
    const overlay = document.getElementById("loaderOverlay");
    const starEls = document.querySelectorAll("#loaderStars span");
    const LOADER_DURATION = 5000;

    starEls.forEach((s, i) => {
      setTimeout(() => s.classList.add("lit"), (i + 1) * (LOADER_DURATION / starEls.length));
    });

    const sparkleEmojis = ["✨", "🌟", "⭐"];
    const sparkleTimer = setInterval(() => {
      const s = document.createElement("div");
      s.className = "loader-sparkle";
      s.textContent = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDuration = (2 + Math.random() * 1.5) + "s";
      overlay.appendChild(s);
      setTimeout(() => s.remove(), 3600);
    }, 350);

    setTimeout(() => {
      clearInterval(sparkleTimer);
      overlay.classList.add("fade-out");
      setTimeout(() => overlay.remove(), 650);
    }, LOADER_DURATION);
  })();
</script>
</body>
</html>
